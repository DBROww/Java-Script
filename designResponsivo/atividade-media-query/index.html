<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria Shrek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="img/logo.png" id="logo" alt="Logo Pizzaria Shrek">
        <nav>
            <a href="#contato"><h2>ENTRE EM CONTATO</h2></a>
            <a href="#contato"><h2>SOBRE NOS</h2></a>
        </nav>
    </header>

    <section class="tituloBox">
        <h1 class="titulo">Bem-Vindo a nossa pizzaria!</h1>
    </section>

    <main>
        <section id="fotos">
            <h1 class="titulo" id="desejadas">As mais desejadas da casa:</h1>
            <div id="saboresPizza">
                <div class="pizza">
                    <h2 class="nomePizza">Shrekão Clássico</h2>
                    <img src="img/pizza-1.png" alt="Pizza Shrekão Clássico" class="fotoPizza">
                </div>

                <div class="pizza">
                    <h2 class="nomePizza">Fiona Suprema</h2>
                    <img src="img/pizza-2.jpg" alt="Pizza Fiona Suprema" class="fotoPizza">
                </div>

                <div class="pizza">
                    <h2 class="nomePizza">Burro Guloso</h2>
                    <img src="img/pizza-3.png" alt="Pizza Burro Guluso" class="fotoPizza">
                </div>

                <div class="pizza">
                    <h2 class="nomePizza">Pântano</h2>
                    <img src="img/pizza-4.png" alt="Pizza Pântano" class="fotoPizza">

                </div>
            </div>
        </section>

        <section id="sectionCardapio">
            <h1 class="textoCardapio">CARDÁPIO</h1>
            <img src="img/cardapio.png" id="cardapio" alt="Cardápio Pizzaria Shrek">
        </section>

    </main>

    <footer>
        <p>&copy; SHREK PIZZARIA</p>
        <nav>
            <a href="#inicio">INÍCIO</a>
            <a href="#sobre">SOBRE</a>
            <a href="#contato">CONTATO</a>
        </nav>
    </footer>
</body>
</html>

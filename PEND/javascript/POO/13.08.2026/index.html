<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
</head>

<body>
    <h1 id="titulo">Cadastro de Aluno</h1>

    <input type="text" name="nome" id="nome" placeholder="Nome">
    <input type="text" name="idade" id="idade" placeholder="Idade">
    <input type="text" name="curso" id="curso" placeholder="Curso">
    <input type="number" name="matricula" id="matricula" placeholder="Matrícula">

    <button id="botaoCadastrar">Cadastrar</button>

    <div id="resultado"></div>

    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
</head>

<body>
    <h1 id="titulo">Cadastro de Produtos</h1>

    <input type="text" name="nome" id="nome" placeholder="Nome">
    <input type="text" name="preco" id="preco" placeholder="Preço">
    <input type="text" name="categoria" id="categoria" placeholder="Categoria">
    <input type="number" name="desconto" id="desconto" placeholder="Desconto">

    <button id="botaoCadastrar">Cadastrar</button>

    <div id="resultado"></div>

    <script src="produtos.js"></script>
</body>

</html>

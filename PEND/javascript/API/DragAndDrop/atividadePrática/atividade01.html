<!DOCTYPE html>
<html lang="pt-br
    <meta charset=" UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="atividade01.css">
<title>Document</title>
</head>

<body>
    <header>
        <h1>Tempo restante: <span id="tempo">30</span></h1>
        <h1>Acerte a bola na cesta!</h1>
        <h1>Acertos: <span id="pontos">0</span></h1>
    </header>

    <main>
        <div id="bola" draggable="true">
            <img src="https://acdn-us.mitiendanube.com/stores/002/112/194/products/microfibra_6-dd8600d0899807531617268387082162-1024-1024.webp"
                alt="">
        </div>

        <div id="cesta">
            <img src="https://png.pngtree.com/png-vector/20240309/ourmid/pngtree-basketball-hoop-and-backboard-png-image_11917588.png"
                alt="">
        </div>

        <div id="fimJogo">

            <h1>O TEMPO ACABOU, FIM DE JOGO!</h1>

            <p>Quantidade de pontos:</p>
            <span id="pontuacaoFinal">0</span>

            <button id="jogarNovamente">
                Jogar novamente?
            </button>

        </div>
    </main>
    <script src="atividade01.js"></script>
</body>

</html>
